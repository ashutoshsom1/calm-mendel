name: Build Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name "linkedin-jobhunter" `
            --add-data "src/linkedin_jobhunter/config/default_profile.yaml;linkedin_jobhunter/config" `
            --paths "src" `
            src/linkedin_jobhunter/__main__.py

      - name: Assemble Release Package
        run: |
          New-Item -ItemType Directory -Force -Path "dist/linkedin-jobhunter/config"
          Copy-Item "config/profile.yaml" "dist/linkedin-jobhunter/config/profile.yaml"
          Copy-Item "README.md" "dist/linkedin-jobhunter/README.md"
          New-Item -ItemType Directory -Force -Path "dist/linkedin-jobhunter/resumes"
          New-Item -ItemType Directory -Force -Path "dist/linkedin-jobhunter/data"
          Compress-Archive -Path "dist/linkedin-jobhunter/*" -DestinationPath "linkedin-jobhunter-windows-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobhunter-windows-x64
          path: linkedin-jobhunter-windows-x64.zip

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: linkedin-jobhunter-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
